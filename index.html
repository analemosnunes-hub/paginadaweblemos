<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LN Fashiom</title>
    
    <style>
        /* Configurações gerais da página */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #000000;
        }

        /* Topo da página */
        header {
            background-color: rgb(102, 16, 37);
            color: burgundy;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
            border-radius: 8px 8px 0 0; /* Arredonda as pontas de cima */
        }

        header h1 {
            margin: 0 0 10px 0;
        }

        header p {
            margin: 0;
            opacity: 0.9;
        }

        /* Conteúdo principal */
        main {
            background-color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 16px;
            box-sizing: border-box;
            border-radius: 0 0 8px 8px; /* Arredonda as pontas de baixo */
            box-shadow: 0 4px 6px rgb(224, 218, 218); /* Sombra leve para dar elegância */
            
            /* Alinha os itens em coluna e centralizados */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Estilização da imagem */
        img {
            width: 120px; /* Um pouco maior para dar destaque */
            height: 120px;
            object-fit: cover; /* Garante que a imagem não fique distorcida */
            border-radius: 50%; /* Deixa a imagem redonda, estilo avatar */
            margin-bottom: 16px;
        }

        main h2 {
            margin: 0 0 8px 0;
            color: rgb(82, 21, 36);
        }

        .autor {
            font-style: italic;
            color: #0e0d0d;
            margin: 0 0 16px 0;
        }

        .mensagem {
            font-size: 1.1rem;
            max-width: 500px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>LNfashion</h1>
        <p>essa pagina é sobre moda</p>
    </header>

    <main>
        <p><img src="ana-nununes.png" alt="Logo da marca"></p>
        <h2>Cada dia uma roupa para vocês
        </h2>
        <p class="autor">Por:Ana Nunes</p>
        <p class="mensagem">Bem-vindos a LNFashion</p>
    </main>

</body>
</html>
